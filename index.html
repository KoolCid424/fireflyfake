<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Gregg School</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #333;
  background: linear-gradient(
    to bottom,
    #fff 0,
    #fff 36.6%,
    #e9e9e9 36.6%,
    #e9e9e9 100%
  );
  min-height: 100vh;
}

.top {
  height: 225px;
  display: flex;
  justify-content: center;
  padding-top: 101px;
}

.crest {
  width: 50px;
  height: 68px;
  background: #073c83;
  clip-path: polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e5c34d;
  font-size: 27px;
  border: 2px solid #d6b64c;
}

.card {
  width: 626px;
  max-width: calc(100% - 28px);
  margin: 0 auto 30px;
  background: white;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 5px 18px #0002;
}

.header {
  height: 72px;
  background: #08266d;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 18px;
  font-weight: bold;
}

.demo-label {
  background: #fff4d6;
  color: #795500;
  text-align: center;
  font-size: 10px;
  padding: 5px;
  letter-spacing: 1px;
}

.content {
  display: grid;
  grid-template-columns: 2fr 1.1fr;
  min-height: 473px;
}

.left {
  padding: 21px 24px;
}

h2 {
  font-size: 20px;
  font-weight: normal;
  line-height: 1.5;
  margin: 0 0 28px;
}

.cloud {
  font-size: 15px;
  margin-bottom: 25px;
}

.field {
  height: 48px;
  background: #eee;
  display: flex;
  align-items: center;
  padding: 0 15px;
  margin-bottom: 22px;
  border-radius: 4px;
}

.field-icon {
  color: #c7c7c7;
  font-size: 19px;
  margin-right: 15px;
}

.field input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-size: 15px;
  color: #333;
}

.field:focus-within {
  outline: 2px solid #009cf5;
}

.show {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  margin-top: -7px;
  margin-bottom: 17px;
}

.show input {
  accent-color: #008df0;
}

.login-button {
  width: 100%;
  height: 45px;
  border: 1px solid #0089df;
  background: #079bf3;
  color: white;
  border-radius: 4px;
  font-size: 16px;
  font-weight: bold;
  cursor: default;
}

.links {
  display: grid;
  gap: 16px;
  margin-top: 16px;
  font-size: 15px;
  color: #008df0;
}

.right {
  border-left: 1px solid #e6e6e6;
}

.right-title {
  padding: 30px 24px 27px;
  border-bottom: 1px solid #e6e6e6;
}

.side {
  height: 76px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px;
  color: #929292;
  border-bottom: 1px solid #e6e6e6;
  font-size: 17px;
}

.side-icon {
  font-size: 20px;
}

.office-button {
  all: unset;
  box-sizing: border-box;
  width: 100%;
  height: 76px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px;
  color: #929292;
  font-size: 17px;
  cursor: pointer;
  border-bottom: 1px solid #e6e6e6;
}

.office-button:hover {
  background: #f7faff;
}

.office-button:focus-visible {
  outline: 2px solid #078df0;
}

.footer {
  height: 41px;
  background: #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 18px;
  color: #bbb;
  font-weight: bold;
}

/* Loading screen */

#loading-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #fff;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.loading-content {
  width: 350px;
  max-width: 90%;
  text-align: center;
  font-family: Arial, sans-serif;
}

.loading-content h1 {
  font-size: 29px;
  font-weight: 400;
  color: #1769aa;
  margin-bottom: 35px;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #ddd;
  border-top-color: #1769aa;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 25px;
}

.loading-content p {
  color: #444;
  font-size: 16px;
}

.loading-content small {
  color: #888;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media(max-width:560px) {
  .top {
    height: 175px;
    padding-top: 65px;
  }

  .content {
    grid-template-columns: 1fr;
  }

  .right {
    border-left: none;
    border-top: 1px solid #e6e6e6;
  }

  .left {
    padding: 22px 24px;
  }
}
</style>
</head>

<body>

<div class="top">
  <div class="crest">★</div>
</div>

<div class="card">

  <div class="header">
    The Gregg School
  </div>

  <div class="demo-label">
    LOGIN PORTAL
  </div>

  <div class="content">

    <div class="left">

      <h2>
        Log in using your email address or username
      </h2>

      <div class="cloud">
        Cloud Users
      </div>

      <div class="field">
        <span class="field-icon">♟</span>
        <input
          type="text"
          placeholder="Email address or username"
          autocomplete="off"
        >
        <span style="color:#83c6ec">◌</span>
      </div>

      <div class="field">
        <span class="field-icon">●</span>
        <input
          type="password"
          placeholder="Password"
          autocomplete="off"
        >
        <span style="color:#83c6ec">◌</span>
      </div>

      <label class="show">
        <input type="checkbox">
        Show password
      </label>

      <button class="login-button" type="button">
        Log in
      </button>

      <div class="links">
        <span>Forgotten your password?</span>
        <span>New to Firefly? Activate your account.</span>
      </div>

    </div>

    <div class="right">

      <div class="right-title">
        Or log in with
      </div>

      <div class="side">
        <span class="side-icon">◉</span>
        Site login (Firefly)
      </div>

      <button
        class="office-button"
        id="office365"
        type="button"
      >
        <span class="side-icon">◧</span>
        Office 365
      </button>

    </div>

  </div>

  <div class="footer">
    ◉ Firefly
  </div>

</div>

<!-- Loading screen -->

<div id="loading-screen">

  <div class="loading-content">

    <h1>Microsoft 365</h1>

    <div class="spinner"></div>

    <p>Connecting to Office 365...</p>

    <small>Please Wait</small>

  </div>

</div>

<script>
document.getElementById("office365").addEventListener("click", function() {

  const loadingScreen = document.getElementById("loading-screen");

  loadingScreen.style.display = "flex";

  setTimeout(function() {

    window.location.href =
      "https://gregg.fireflycloud.org/student-dashboard-1";

  }, 5000);

});
</script>

</body>
</html>
